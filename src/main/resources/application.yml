spring:
  application:
    name: machtrip-backend
  config:
    # Local .env (git-ignored) is picked up when present; real environment variables also work.
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:machtrip}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema
  jackson:
    mapper:
      accept-case-insensitive-enums: true
#  data:
#    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}
#      repositories:
#        enabled: false   # Redis is only used as a plain cache (StringRedisTemplate)

management:
  endpoints:
    web:
      exposure:
        include: health,info

machtrip:
  recommend:
    cache-ttl: ${RECOMMEND_CACHE_TTL:10m}
    tag-bonus: 0.1
    max-results: 20
    # Max price_min (VND) a place may have for each budget level; HIGH has no cap.
    budget-caps:
      low: 100000
      medium: 400000
